<!DOCTYPE html>
<html lang="ko" data-app="diary">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFF3">
<title>빛줍기</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../shared/base.css">
<style>
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
.t-ko,.t-zh{font-family:var(--title);font-weight:700}
.greet{padding:20px 0 16px}
.greet h1{margin:0;font-size:28px;line-height:1.3}
.greet p{margin:2px 0 0;color:var(--muted);font-size:15px}
.home-grid{display:grid;gap:20px;padding-bottom:120px}
@media (min-width:900px){.home-grid{grid-template-columns:340px 1fr;align-items:start}}
.side{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 12px 12px}
.cal-head{display:flex;align-items:center;gap:2px;margin-bottom:6px}
.cal-head h2{flex:1;margin:0 0 0 6px;font-size:18px}
.cal-today{min-height:32px;padding:0 10px;font-size:13px}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.cal-week span{font-size:12px;color:var(--muted);padding:4px 0}
.cal-week span:first-child{color:var(--err)}
.cal-grid{gap:2px}
.cal-day{position:relative;aspect-ratio:1/1;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;color:var(--muted);padding:0}
.cal-day:hover{background:var(--soft)}
.cal-day .n{line-height:1}
.cal-day .mark{font-size:14px;line-height:1;height:15px;margin-top:3px}
.cal-day.lit{color:var(--ink);font-weight:600;background:radial-gradient(circle at 50% 58%,var(--lamp-soft) 0%,transparent 72%)}
.cal-day.lit .mark:empty::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lamp);box-shadow:0 0 8px 2px var(--lamp-glow);margin-top:4px}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent-text);font-weight:600}
.cal-day.selected{background:var(--soft)}
.cal-day.future{opacity:.45}
.cal-stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 6px 0;font-size:14px;color:var(--muted)}
.cal-stats strong{color:var(--ink);font-weight:600}
.mood-panel{padding:16px}
.mood-panel h2{font-size:18px;margin:0 0 4px}
.mood-sum{font-size:14px;color:var(--muted);margin:0 0 8px}
.mood-chart{width:100%;height:auto;display:block;overflow:visible}
.mood-chart .grid{stroke:var(--line);stroke-width:1}
.mood-chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.7}
.mood-chart .pt{fill:var(--lamp);stroke:var(--surface);stroke-width:2}
.mood-chart g{cursor:pointer}
.mood-chart .hit{fill:transparent}
.mood-chart .ax{font-size:10px;fill:var(--muted);font-family:var(--ui)}
.mood-dist{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:14px;color:var(--muted)}
.mood-empty{color:var(--muted);font-size:14px;margin:4px 0 0}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:transparent;padding:11px 0;font-size:16px;outline:none;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.chip button{border:0;background:transparent;color:inherit;width:28px;height:28px;border-radius:50%;padding:0;margin-right:-8px}
.chip-link{border:0;background:none;color:var(--accent-text);font-size:14px;padding:6px;text-decoration:underline;text-underline-offset:3px}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border-radius:var(--r-card);background:var(--lamp-soft);font-size:15px}
.banner span{flex:1;min-width:160px}
.memories{margin-top:14px;display:grid;gap:10px}
.memory{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-card);padding:12px 14px;color:inherit}
.memory:hover{border-color:var(--accent)}
.memory span{display:block}
.memory .when{font-size:13px;color:var(--accent-text);font-weight:600}
.memory .tt{font-size:17px;margin:2px 0}
.memory .x{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.month{margin-top:24px}
.month-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding:0 2px 6px}
.month-h h3{margin:0;font-size:18px}
.month-h span{font-size:13px;color:var(--muted)}
.entry{display:flex;gap:14px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 2px;align-items:flex-start;color:inherit}
.entry:hover{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.e-date{width:40px;flex:none;text-align:center}
.e-date .d{display:block;font-family:var(--title);font-weight:700;font-size:24px;line-height:1.1}
.e-date .wd{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.e-body{flex:1;min-width:0}
.e-body h4{margin:0;font-size:17px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-body p{margin:3px 0 0;color:var(--muted);font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.e-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;font-size:13px;color:var(--muted)}
.thumb{width:62px;height:62px;object-fit:cover;border-radius:10px;flex:none;background:var(--line)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty h3{font-size:22px;color:var(--ink);margin:0 0 8px}
.empty p{margin:0 0 18px}
.fab-bar{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:15}
.fab-bar .in{max-width:1060px;margin:0 auto;display:flex;justify-content:flex-end}
.fab{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;min-height:52px;padding:0 22px;border-radius:999px;box-shadow:0 6px 18px rgba(20,25,45,.25)}
.fab svg{width:20px;height:20px}
/* 읽기·쓰기 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 6px}
.topbar .grow{flex:1;min-width:0;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page{max-width:780px;margin:0 auto;padding:24px 20px 120px}
.r-date{color:var(--muted);font-size:14px;margin:0}
.r-title{font-size:30px;line-height:1.35;margin:6px 0 12px;overflow-wrap:anywhere}
.r-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--muted);background:var(--surface)}
button.pill{border:0;background:var(--soft);color:var(--accent-text)}
.prose{font-size:18px;line-height:1.9;overflow-wrap:anywhere;font-family:var(--serif)}
/* 글꼴은 글자마다 정해지고(base.css), 언어는 문단마다 판별해 줄바꿈 규칙에만 쓴다 */
.prose [lang]{font-family:var(--serif)}
.prose[lang="ko"],.prose [lang="ko"]{word-break:keep-all;line-break:auto}
.prose[lang^="zh"],.prose [lang^="zh"]{word-break:normal;line-break:strict}
.e-body p[lang],.memory .x[lang]{font-family:var(--ui)}
.prose img:not([src]){min-height:140px;width:100%;background:var(--soft)}
.more{display:flex;justify-content:center;padding:18px 0 4px}
:root[data-theme="dark"] .prose,:root:not([data-theme="light"]) .prose{color:color-mix(in srgb,var(--ink) 92%,var(--muted))}
.prose p{margin:0 0 .9em}
.prose h3{font-size:1.15em;line-height:1.5;margin:1.3em 0 .5em}
.prose blockquote{margin:1em 0;padding:.1em 0 .1em 1em;border-left:3px solid var(--lamp);color:var(--muted)}
.prose ul,.prose ol{padding-left:1.4em;margin:0 0 .9em}
.prose img{display:block;max-width:100%;height:auto;border-radius:12px;margin:.6em 0}
.prose a{color:var(--accent-text)}
.r-foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.ef{margin-bottom:18px}
.date-input{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-ctl);padding:0 12px;font-size:16px}
.title-input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:26px;font-weight:700;padding:6px 0 10px;outline:none}
.title-input{font-family:var(--title)}
.title-input:focus{border-bottom-color:var(--accent)}
.title-input::placeholder{color:var(--muted);font-weight:400;opacity:.8}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-ctl);padding:6px 8px;min-width:58px;min-height:56px;font-size:12px;color:var(--muted)}
.pick .e{font-size:22px;line-height:1.2}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--ink);font-weight:600}
.tags-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-ctl);padding:6px 8px;min-height:44px}
.tags-box input{flex:1;min-width:120px;border:0;background:transparent;outline:none;font-size:16px;padding:4px}
.tag{display:inline-flex;align-items:center;gap:2px;background:var(--soft);color:var(--accent-text);border-radius:999px;padding:2px 2px 2px 10px;font-size:14px}
.tag button{border:0;background:none;color:inherit;width:28px;height:28px;border-radius:50%;padding:0}
.editor-shell{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface)}
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:5;display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:var(--r-card) var(--r-card) 0 0}
.toolbar button{flex:none;width:40px;height:40px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:15px}
.toolbar button:hover{background:var(--soft);color:var(--ink)}
.toolbar button[aria-pressed="true"]{background:var(--soft);color:var(--accent-text)}
.toolbar svg{width:18px;height:18px}
.toolbar .sep{flex:none;width:1px;background:var(--line);margin:6px 4px}
.editor{min-height:45vh;padding:16px 18px;outline:none;position:relative}
.editor.is-empty::before{content:attr(data-placeholder);color:var(--muted);opacity:.8;position:absolute;pointer-events:none}
.edit-foot{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:8px}
@media (max-width:520px){
  .greet h1{font-size:24px}
  .r-title{font-size:25px}
  .prose{font-size:17px}
  .picker{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 2px}
  .pick{flex:none;min-width:56px}
}
</style>
</head>
<body>
<header id="appbar"></header>

<!-- 홈 -->
<div id="v-home">
  <div class="wrap">
    <div class="greet"><h1 class="t-ko" id="greetTitle"></h1><p id="greetSub"></p></div>
    <div class="home-grid">
      <div class="side">
        <section class="panel" id="calPanel">
          <div class="cal-head">
            <h2 class="t-title" id="calTitle"></h2>
            <button class="btn cal-today" id="calToday" hidden></button>
            <button class="icon-btn" id="calPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            <button class="icon-btn" id="calNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
          <div class="cal-week" id="calWeek" aria-hidden="true"></div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-stats" id="calStats"></div>
        </section>
        <section class="panel mood-panel"><h2 class="t-title" id="moodTitle"></h2><div id="moodBody"></div></section>
      </div>
      <section id="listSection">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="searchInput" autocomplete="off">
        </label>
        <div class="chips" id="chips"></div>
        <div class="memories" id="memories" hidden></div>
        <div class="banner" id="draftBanner" hidden><span data-i="draftBanner"></span><button class="btn primary" id="draftResume" data-i="resume"></button><button class="btn bare" id="draftDiscard" data-i="discard"></button></div>
        <div id="list"></div>
      </section>
    </div>
  </div>
  <div class="fab-bar"><div class="in"><button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i="fab"></span></button></div></div>
</div>

<!-- 읽기 -->
<div id="v-read" hidden>
  <div class="topbar"><div class="in">
    <button class="btn bare" id="readBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span data-i="back"></span></button>
    <div class="grow"></div>
    <button class="btn" id="readEdit" data-i="edit"></button>
    <button class="btn danger" id="readDelete" data-i="delete"></button>
  </div></div>
  <article class="page">
    <p class="r-date" id="readDate"></p>
    <h1 class="r-title" id="readTitle"></h1>
    <div class="r-meta" id="readMeta"></div>
    <div class="prose" id="readContent"></div>
    <div class="r-foot" id="readFoot"></div>
  </article>
</div>

<!-- 쓰기 -->
<div id="v-edit" hidden>
  <div class="topbar"><div class="in">
    <button class="btn bare" id="editCancel" data-i="cancel"></button>
    <div class="grow" id="editHeading"></div>
    <button class="btn primary" id="editSave" data-i="save"></button>
  </div></div>
  <div class="page">
    <div class="ef"><label class="field" style="display:inline-flex"><span data-i="date"></span><input type="date" id="dateInput" class="date-input"></label></div>
    <div class="ef"><input type="text" id="titleInput" class="title-input" maxlength="200" autocomplete="off"></div>
    <div class="ef"><span class="field-label" id="moodLabel" data-i="mood"></span><div class="picker" id="moodPicker" role="group" aria-labelledby="moodLabel" style="margin-top:6px"></div></div>
    <div class="ef"><span class="field-label" id="weatherLabel" data-i="weather"></span><div class="picker" id="weatherPicker" role="group" aria-labelledby="weatherLabel" style="margin-top:6px"></div></div>
    <div class="ef"><label class="field-label" for="tagInput" data-i="tags"></label><div class="tags-box" id="tagsBox" style="margin-top:6px"><input type="text" id="tagInput" autocomplete="off" maxlength="30"></div></div>
    <div class="editor-shell">
      <div class="toolbar" role="toolbar" id="toolbar">
        <button type="button" data-cmd="bold" aria-pressed="false"><b>B</b></button>
        <button type="button" data-cmd="italic" aria-pressed="false"><i style="font-family:serif">I</i></button>
        <button type="button" data-cmd="underline" aria-pressed="false"><u>U</u></button>
        <button type="button" data-cmd="strikeThrough" aria-pressed="false"><s>S</s></button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" data-block="h3">H</button>
        <button type="button" data-cmd="insertUnorderedList"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg></button>
        <button type="button" data-cmd="insertOrderedList"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 4v4M3 18h3l-3 3h3" stroke-width="1.6"/></svg></button>
        <button type="button" data-block="blockquote"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 7h4v4c0 3-1.5 5-4 6l-.7-1.2C7.8 15 8.6 13.6 8.7 12H7zm8 0h4v4c0 3-1.5 5-4 6l-.7-1.2c1.5-.8 2.3-2.2 2.4-3.8H15z"/></svg></button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" id="imgBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button>
        <input type="file" id="imgInput" accept="image/*" multiple hidden>
      </div>
      <div id="editor" class="editor prose is-empty" contenteditable="true" role="textbox" aria-multiline="true" lang="ko"></div>
    </div>
    <div class="edit-foot"><span id="charCount"></span><span id="draftState"></span></div>
  </div>
</div>

<dialog id="settingsDlg"><div class="dlg"><h2 data-i="settings"></h2><div id="diarySettings"></div><div id="commonBox"></div><div id="wipeBox"></div><div class="dlg-actions"><button class="btn primary" id="settingsClose" data-i="close"></button></div></div></dialog>
<input type="file" id="importInput" accept=".json,application/json" hidden>

<script type="module">
import * as Core from '../shared/core.js';
const { esc, toast, ask, LS } = Core;

/* ===================== 문구 ===================== */
const D = {
  ko: {
    wd: ['일','월','화','수','목','금','토'],
    md: (m, d) => `${m}월 ${d}일`, mdw: (m, d, w) => `${m}월 ${d}일 ${w}요일`, ym: (y, m) => `${y}년 ${m}월`,
    long: (y, m, d, w) => `${y}년 ${m}월 ${d}일 ${w}요일`,
    clock: (dt) => `${dt.getMonth()+1}월 ${dt.getDate()}일 ${dt.getHours() < 12 ? '오전' : '오후'} ${(dt.getHours() % 12) || 12}:${String(dt.getMinutes()).padStart(2,'0')}`,
    hm: (dt) => `${dt.getHours() < 12 ? '오전' : '오후'} ${(dt.getHours() % 12) || 12}:${String(dt.getMinutes()).padStart(2,'0')}`,
    todayHas: '오늘 {n}편을 남겼어요.', todayNone: '아직 오늘의 기록이 없어요.', today: '오늘', prevMonth: '이전 달', nextMonth: '다음 달',
    monthCount: '이번 달 <strong>{n}편</strong>', streak: '<strong>{n}일</strong> 연속으로 쓰는 중',
    withEntries: ', 일기 {n}편', newEntryAria: ', 새 일기 쓰기', moodTitle: '{m}월의 기분',
    moodEmpty: '이 달에는 기분을 고른 일기가 없어요. 일기를 쓸 때 기분을 고르면 여기에 흐름이 그려져요.',
    moodSum: '평균 {e} {avg}점, 기분을 남긴 날 {n}일', dayUnit: '{d}일', moodChartAria: '{m}월 날짜별 기분 점수',
    search: '제목, 내용, 태그로 찾기', clearFilter: '필터 해제', writeThisDate: '이 날짜로 쓰기',
    draftBanner: '저장하지 않은 글이 있어요.', resume: '이어 쓰기', discard: '버리기', draftDiscarded: '임시 저장한 글을 버렸어요.',

const TAGS = { P:'p',BR:'br',B:'b',STRONG:'b',I:'i',EM:'i',U:'u',S:'s',STRIKE:'s',DEL:'s',H1:'h3',H2:'h3',H3:'h3',H4:'h3',UL:'ul',OL:'ol',LI:'li',BLOCKQUOTE:'blockquote',IMG:'img',A:'a',DIV:'p' };

const safeImg = s => { s = (s || '').trim(); return /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=\s]+$/i.test(s) ? s.replace(/\s+/g, '') : null; };

function sanitizeHTML(html, { keepPid = true } = {}) {
  const doc = new DOMParser().parseFromString('<!doctype html><body>' + String(html || ''), 'text/html');
  const out = document.createElement('div');
  (function walk(src, dst) {
    for (const n of Array.from(src.childNodes)) {
      if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue)); continue; }
      if (n.nodeType !== 1 || DROP.has(n.tagName)) continue;
      const name = TAGS[n.tagName];
      if (!name) { walk(n, dst); continue; }
      const el = document.createElement(name);
      if (name === 'img') {
        const s = safeImg(n.getAttribute('src')), pid = keepPid ? safePid(n.getAttribute('data-pid')) : null;
        if (!s && !pid) continue;
        if (s) el.setAttribute('src', s);
        if (pid) el.setAttribute('data-pid', pid);
        el.setAttribute('alt', ''); dst.appendChild(el); continue;

}
function htmlToText(html) {

async function loadPhotos(pids) {
  const need = [...new Set(pids)].filter(id => id && !photoCache.has(id));
  for (let i = 0; i < need.length; i += 8) {
    await Promise.all(need.slice(i, i + 8).map(async id => {
      // 연결이 막힌 곳(중국 본토 등)에서 오래 기다리지 않도록 8초까지만
      const timeout = new Promise(res => setTimeout(() => res(null), 8000));
      try { const d = await Promise.race([Core.getDoc(PHOTOS, id), timeout]); if (d && safeImg(d.src)) photoCache.set(id, safeImg(d.src)); } catch (e) { console.warn(e); }
    }));
  }
  return pids.every(id => photoCache.has(id));
}
// 화면에 붙은 img[data-pid]에 사진을 채움(없으면 회색 자리만)
function fillPhotos(root, isCurrent = () => true) {
  const imgs = [...root.querySelectorAll('img[data-pid]:not([src])')];
  const set = () => imgs.forEach(im => { const s = photoCache.get(im.dataset.pid); if (s) im.src = s; });
  set();
  const missing = imgs.filter(im => !im.src).map(im => im.dataset.pid);
  if (missing.length) loadPhotos(missing).then(() => { if (isCurrent()) set(); });
}

async function splitPhotos(entry, makePid, writeAll) {
  const doc = new DOMParser().parseFromString('<!doctype html><body>' + entry.html, 'text/html');
  const docs = [], pids = []; let i = 0;
  for (const img of doc.querySelectorAll('img')) {
    const src = safeImg(img.getAttribute('src')); let pid = safePid(img.getAttribute('data-pid'));
    if (src) {
      const isNew = !pid;
      if (!pid) pid = makePid(i);
      if (isNew || writeAll) docs.push([pid, { entry: entry.id, src, createdAt: Date.now() }]);
      photoCache.set(pid, src);
      img.removeAttribute('src'); img.setAttribute('data-pid', pid);
    }
    if (pid) pids.push(pid);
    i++;
  }
  const html = sanitizeHTML(doc.body.innerHTML);
  const photos = [...new Set(pids)];
  let thumb = entry.thumb || '';
  if (!photos.length) thumb = '';
  else if (!thumb || photos[0] !== (entry.photos || [])[0]) {
    const src = photoCache.get(photos[0]);
    if (src) { try { thumb = await compressToDataURL(dataURLtoBlob(src), 160, 0.6); } catch { thumb = ''; } }
  }

function inlinePhotos(html) {

  if (files.length) { e.preventDefault(); insertImages(files); return; }
  const html = cd.getData('text/html'); if (html) { e.preventDefault(); document.execCommand('insertHTML', false, sanitizeHTML(html, { keepPid: false })); return; }
  const text = cd.getData('text/plain'); if (text) { e.preventDefault(); document.execCommand('insertText', false, text); }
});
editor.addEventListener('drop', e => { const files = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/')); if (files.length) { e.preventDefault(); insertImages(files); } });

/* 사진: 줄이고 다시 저장(위치 정보도 지워짐)해서 일기 안에 넣음 */
async function loadBitmap(blob) {
  try { if (window.createImageBitmap) return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch {}
  return await new Promise((res, rej) => { const u = URL.createObjectURL(blob), im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('decode')); im.src = u; });
}
async function compressToDataURL(blob, maxSide = 1280, q = 0.72) {
  const img = await loadBitmap(blob), s = Math.min(1, maxSide / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function dataURLtoBlob(u) { const [h, b] = u.split(','); const mime = /data:([^;]+)/.exec(h)[1]; const bin = atob(b), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime }); }
async function insertImages(list) {
  const files = [...list].filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name || '')); if (!files.length) return;
  const tt = toast(t('imgAdding', { n: files.length }), { ms: 0 });
  for (const f of files) {
    try { const src = await compressToDataURL(f); restoreSel(); document.execCommand('insertHTML', false, `<p><img src="${src}" alt=""></p><p><br></p>`); const s = getSelection(); if (s.rangeCount) savedRange = s.getRangeAt(0).cloneRange(); }
    catch { toast(t('imgFail'), { kind: 'err' }); }
  }
  tt.dismiss(); onEditorInput();
}
async function shrinkImages(entry) {
  if (!/src="data:image/.test(entry.html)) return entry;
  const doc = new DOMParser().parseFromString('<!doctype html><body>' + entry.html, 'text/html');
  for (const img of doc.querySelectorAll('img[src^="data:image"]')) {
    const src = img.getAttribute('src'); if (src.length < 200000) continue;
    try { img.setAttribute('src', await compressToDataURL(dataURLtoBlob(src))); } catch { img.remove(); }
  }
  const html = sanitizeHTML(doc.body.innerHTML); return { ...entry, html, text: htmlToText(html) };
}

/* ===================== 지우기·백업 ===================== */
async function deleteEntry(id) {
  const copy = state.entries[id]; if (!copy) return;
  // 되돌리기에 쓰려고 사진을 먼저 확보. 확보하지 못한 사진은 지우지 않고 남겨 둠(기록 손실 방지)
  await loadPhotos(copy.photos);
  const saved = copy.photos.filter(p => photoCache.has(p));
  delete state.entries[id];
  Core.writeBatch([{ name: 'diary', id, del: true }, ...saved.map(p => ({ name: PHOTOS, id: p, del: true }))]).catch(() => {});
  show('home'); renderHome();
  toast(t('deleted'), { action: t('undo'), ms: 8000, onAction: () => {
    const e = { ...copy, updatedAt: Date.now() }; state.entries[id] = e;
    Core.writeBatch([...saved.map(p => ({ name: PHOTOS, id: p, val: { entry: id, src: photoCache.get(p), createdAt: Date.now() } })), { name: 'diary', id, val: toDoc(e) }]).catch(() => {});
    renderHome(); toast(t('restored'));
  } });
}
// 백업 파일: 사진을 본문 안에 다시 넣어 파일 하나로 완결. 사진을 다 못 불러오면 실패(true/false 반환)
async function exportAll() {
  const list = sortedEntries(); if (!list.length) { toast(t('nothingToExport')); return false; }
  const tt = toast(t('exporting'), { ms: 0 });
  const ok = await loadPhotos(list.flatMap(e => e.photos));
  tt.dismiss();
  if (!ok) { toast(t('exportFail'), { kind: 'err', ms: 8000 }); return false; }
  const out = list.map(({ thumb, photos, ...e }) => ({ ...e, html: inlinePhotos(e.html) }));
  const json = JSON.stringify({ app: 'bitjupgi', version: 4, exportedAt: new Date().toISOString(), entries: out });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = `diary-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  LS.set('diary.lastBackup', Date.now()); toast(t('exported'));
  return true;
}
async function importFile(file) {
  let raw; try { raw = JSON.parse(await file.text()); } catch { toast(t('importBad'), { kind: 'err', ms: 6000 }); return; }
  let list = Array.isArray(raw) ? raw : Array.isArray(raw?.entries) ? raw.entries : (raw && typeof raw === 'object') ? Object.entries(raw).map(([k, v]) => ({ ...(v || {}), id: (v && v.id) || k })) : [];
  list = list.filter(v => v && typeof v === 'object' && (v.content || v.html || v.title));
  if (!list.length) { toast(t('importNone'), { kind: 'err' }); return; }
  const tt = toast(t('importing', { n: list.length }), { ms: 0 });
  let a = 0, u = 0, skip = 0, big = 0; const writes = [];
  for (const r of list) {
    const n = await shrinkImages(normalize(r));
    const cur = state.entries[n.id];
    if (cur && (cur.updatedAt || 0) >= n.updatedAt) { skip++; continue; }
    const { entry: e, docs } = await splitPhotos({ ...n, photos: [], thumb: '' }, i => `m-${n.id}-${i}`, true);
    if (byteSize(toDoc(e)) > DOC_LIMIT || docs.some(([, d]) => byteSize(d) > DOC_LIMIT)) { big++; continue; }
    cur ? u++ : a++; state.entries[e.id] = e;
    writes.push(...docs.map(([id, val]) => ({ name: PHOTOS, id, val })), { name: 'diary', id: e.id, val: toDoc(e) });
  }
  if (writes.length) Core.writeBatch(writes).catch(() => {});
  tt.dismiss(); renderHome();
  toast(t('importDone', { a, u }) + (skip ? t('importSkip', { n: skip }) : '') + (big ? t('importBig', { n: big }) : ''), { ms: 7000 });
}
// 전체 삭제(공통 모듈이 백업 → 직접 입력 확인 → 이 함수 순서로 부름): 일기와 사진만, 설정은 그대로
async function wipeDiary() {
  const photos = await Core.readAll(PHOTOS);
  const ids = Object.keys(state.entries);
  await Core.writeBatch([...ids.map(id => ({ name: 'diary', id, del: true })), ...photos.map(p => ({ name: PHOTOS, id: p.id, del: true }))]);
  for (const id of ids) delete state.entries[id];
  photoCache.clear(); renderHome();
}

/* ===================== 설정 ===================== */
function renderSettings() {
  const n = Object.keys(state.entries).length, last = LS.get('diary.lastBackup', null);
  $('#diarySettings').innerHTML = `
    <div class="set-sec"><h3>${esc(t('uiLang'))}</h3><div class="seg" role="group" aria-label="${esc(t('uiLang'))}">
      <button data-ui="ko" lang="ko" aria-pressed="${cfg.uiLang === 'ko'}">한국어</button><button data-ui="zh" lang="zh-CN" aria-pressed="${cfg.uiLang === 'zh'}">中文</button></div></div>
    <div class="set-sec"><h3>${esc(t('backup'))}</h3><p>${esc(last ? t('lastBackup', { t: timeAgo(last) }) : t('neverBackup'))}${cfg.uiLang === 'zh' ? '' : ' '}${esc(t('importNote'))}</p>
      <div class="set-row"><button class="btn" data-s="export">${esc(t('exportBtn', { n }))}</button><button class="btn" data-s="import">${esc(t('importBtn'))}</button></div></div>`;
  wipeUI?.render();
}
function openSettings() { renderSettings(); $('#settingsDlg').showModal(); }
$('#diarySettings').addEventListener('click', e => {
  const ui = e.target.closest('[data-ui]');
  if (ui) { setCfg({ uiLang: ui.dataset.ui }); return; }
  const b = e.target.closest('[data-s]'); if (!b) return;
  if (b.dataset.s === 'export') exportAll();
  if (b.dataset.s === 'import') $('#importInput').click();
});
$('#settingsClose').onclick = () => $('#settingsDlg').close();
$('#importInput').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) { $('#settingsDlg').close(); importFile(f); } };
function setCfg(partial, fromRemote) {
  const langChanged = partial.uiLang && partial.uiLang !== cfg.uiLang;
  Object.assign(cfg, partial); LS.set('diary.settings', cfg);
  if (langChanged) applyLang();
  if ($('#settingsDlg').open) { renderSettings(); }
  if (!fromRemote) Core.saveSettings('diary', partial).catch(() => {});
}

/* ===================== 이벤트 ===================== */
$('#calPrev').onclick = () => { if (--state.cal.m < 0) { state.cal.m = 11; state.cal.y--; } renderCalendar(entriesByDate()); };
$('#calNext').onclick = () => { if (++state.cal.m > 11) { state.cal.m = 0; state.cal.y++; } renderCalendar(entriesByDate()); };
$('#calToday').onclick = () => { const n = new Date(); state.cal = { y: n.getFullYear(), m: n.getMonth() }; renderCalendar(entriesByDate()); };
$('#calGrid').addEventListener('click', e => {
  const b = e.target.closest('.cal-day'); if (!b) return; const ds = b.dataset.date;
  if (b.classList.contains('lit')) { state.filter.date = state.filter.date === ds ? null : ds; renderHome(); if (state.filter.date && innerWidth < 900) $('#listSection').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else openEditor(null, ds);
});
$('#moodBody').addEventListener('click', e => { const g = e.target.closest('[data-date]'); if (!g) return; state.filter.date = g.dataset.date; renderHome(); if (innerWidth < 900) $('#listSection').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
$('#moodBody').addEventListener('keydown', e => { const g = e.target.closest('[data-date]'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
$('#searchInput').addEventListener('input', e => { state.filter.q = e.target.value; state.limit = PAGE; renderList(); renderMemories(); });
document.addEventListener('click', e => {
  if (e.target.closest('[data-more]')) { state.limit += PAGE; renderList(); return; }
  const o = e.target.closest('[data-open]'); if (o) { openRead(o.dataset.open); return; }
  const w = e.target.closest('[data-write-date]'); if (w) { openEditor(null, w.dataset.writeDate); return; }
  const c = e.target.closest('[data-clear]');
  if (c) { const k = c.dataset.clear; if (k === 'all') { state.filter = { q: '', date: null, tag: null }; $('#searchInput').value = ''; } else state.filter[k] = null; renderHome(); return; }
  const tg = e.target.closest('#readMeta [data-tag]');
  if (tg) { state.filter = { q: '', date: null, tag: tg.dataset.tag }; $('#searchInput').value = ''; show('home'); renderHome(); }
});
$('#fab').onclick = () => openEditor(null, todayStr());
$('#readBack').onclick = () => { show('home'); renderHome(); };
$('#readEdit').onclick = () => openEditor(state.currentId);
$('#readDelete').onclick = () => deleteEntry(state.currentId);
$('#editCancel').onclick = leaveEdit;
$('#editSave').onclick = saveEdit;
$('#titleInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); restoreSel(); } });
$('#tagInput').addEventListener('keydown', e => {
  if (e.isComposing) return;
  if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(e.target.value); e.target.value = ''; }
  else if (e.key === 'Backspace' && !e.target.value && edit.tags.length) { edit.tags.pop(); renderTags(); scheduleDraft(); }
});
$('#tagInput').addEventListener('blur', e => { if (e.target.value.trim()) { addTag(e.target.value); e.target.value = ''; } });
$('#draftResume').onclick = () => { const d = LS.get('diary.draft', null); if (d) openEditor(d.forId && state.entries[d.forId] ? d.forId : null, d.date); };
$('#draftDiscard').onclick = () => { LS.del('diary.draft'); renderDraftBanner(); toast(t('draftDiscarded')); };
document.addEventListener('keydown', e => { if (state.view === 'edit' && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveEdit(); } });
addEventListener('beforeunload', e => { if (state.view === 'edit' && isDirty()) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.view === 'home') renderHome(); });

/* ===================== 시작 ===================== */
applyLang();
await Core.init({ app: 'diary', lang: cfg.uiLang, root: '../' });
Core.mountAppbar({ onSettings: openSettings });
Core.mountCommonSettings($('#commonBox'));
wipeUI = Core.mountWipeSection($('#wipeBox'), { label: () => t('wipe', { n: Object.keys(state.entries).length }), count: () => Object.keys(state.entries).length, backup: exportAll, wipe: wipeDiary });
applyLang();
Core.watchSettings('diary', d => {
  if (d.uiLang && d.uiLang !== cfg.uiLang) setCfg({ uiLang: d.uiLang }, true);
  // 글꼴 개편으로 없앤 본문 글꼴 설정을 정리
  if ('fontKo' in d || 'fontZh' in d) Core.saveSettings('diary', { fontKo: Core.deleteField(), fontZh: Core.deleteField() }).catch(() => {});
});
Core.watchCollection('diary', (docs, meta) => {
  const next = {};
  for (const d of docs) { try { next[d.id] = normalize({ ...d.data, id: d.id }); } catch {} }
  state.entries = next;
  if (!meta.fromCache) state.loaded = true; else if (docs.length) state.loaded = true;
  refreshVisible();
  if (!meta.fromCache && !meta.pending) migrateInline();
});
</script>
